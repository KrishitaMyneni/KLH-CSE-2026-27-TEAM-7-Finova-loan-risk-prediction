[project]
name = "credit-risk-scoring"
version = "2.1.0"
description = "Leakage-free, calibrated probability-of-default model and scoring API on Lending Club data"
requires-python = ">=3.10"
readme = "README.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["archive"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E402",  # imports after sys.path setup in entry points
    "B008",  # FastAPI File(...) defaults
    "E501",  # long user-facing message strings
]

[tool.ruff.lint.isort]
known-first-party = ["config", "src", "app"]
